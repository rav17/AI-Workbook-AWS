[project]
name = "aria-ai-relationship-manager"
version = "0.1.0"
description = "Aria AI Relationship Manager"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "boto3>=1.34.0",
    "python-dateutil>=2.9.0",
    "PyJWT==2.15.1",
    "strands-agents==1.34.1",
    "bedrock-agentcore==1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "hypothesis>=6.116.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.3",
    "detect-secrets>=1.5.0",
    "pyyaml>=6.0.2",
]
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aria*"]
exclude = ["tests*", "cdk*", "specs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = [
    ".agentcore-generated",
    ".agentcore-preview",
    "docs/architecture/generate_diagrams.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["aria"]

[tool.coverage.report]
show_missing = true
fail_under = 70
