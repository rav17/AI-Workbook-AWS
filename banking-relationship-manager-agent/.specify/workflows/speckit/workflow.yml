schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Profile-Aware Lifecycle Session"
  version: "1.1.0"
  author: "GitHub"
  description: "Confirm the work profile and orchestrate its stages through the conductor, stopping at human gates"

requires:
  speckit_version: ">=1.0.7"
  integrations:
    any: ["copilot"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the work, name a profile, or request resume"
  integration:
    type: string
    default: "auto"
    prompt: "Use the configured Copilot integration; other harnesses need their own adapter"

steps:
  - id: lifecycle-session
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 3600
    prompt: |
      Use the installed .github/skills/speckit-workflow/SKILL.md entry skill.
      Request: {{ inputs.spec }}
      Classify the work with python -m speckit_flow workflow recommend; ask the
      user to confirm the profile before initializing. Ask when ambiguous.
      Preserve an existing feature's route when explicitly resuming it.
      Use python -m speckit_flow workflow dispatch preflight and invoke the
      actual speckit-conductor custom agent, not a parent-only stage imitation.
      Execute only eligible routed stages and stop at human gates or failures.
      If this CLI session cannot ask the user or invoke nested subagents, report
      the blocker and stop without initializing or bypassing confirmations.
      Report lifecycle status and pending human action. Session completion is
      not feature completion and never authorizes deployment or gate approval.
