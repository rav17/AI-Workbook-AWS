name: Deploy AgentCore Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      deploy:
        description: Apply the reviewed change set
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      COGNITO_USER_POOL_ARN: ${{ vars.COGNITO_USER_POOL_ARN }}
      COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      TENANT_CLAIM_NAME: ${{ vars.TENANT_CLAIM_NAME }}
      IDEMPOTENCY_TTL_SECONDS: ${{ vars.IDEMPOTENCY_TTL_SECONDS }}
      CDK_PERMISSIONS_BOUNDARY_ARN: ${{ vars.CDK_PERMISSIONS_BOUNDARY_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.10.3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Verify required deployment configuration
        shell: bash
        run: |
          test -n "$COGNITO_USER_POOL_ARN" || { echo "COGNITO_USER_POOL_ARN is required"; exit 1; }
          test -n "$COGNITO_APP_CLIENT_ID" || { echo "COGNITO_APP_CLIENT_ID is required"; exit 1; }
          test -n "$BEDROCK_MODEL_ID" || { echo "BEDROCK_MODEL_ID is required"; exit 1; }
          if [[ "$DEPLOY_ENVIRONMENT" != "dev" ]]; then
            test -n "$CDK_PERMISSIONS_BOUNDARY_ARN" || { echo "CDK_PERMISSIONS_BOUNDARY_ARN is required outside dev"; exit 1; }
          fi
      - name: Install CDK dependencies
        run: python -m pip install -r cdk/requirements.txt -r cdk/requirements-dev.txt
      - name: Install CDK CLI
        run: npm install --global aws-cdk@2.1142.0
      - name: Build deployment artifacts
        run: uv run python scripts/build_artifacts.py --target all
      - name: Run Python quality gates
        run: |
          uv run python -m ruff format --check .
          uv run python -m ruff check .
          uv run python -m mypy aria
          uv run python -m pytest --cov=aria --cov-report=term-missing --cov-fail-under=70
          uv run pip-audit -r requirements.txt -r requirements-dev.txt -r cdk/requirements.txt -r cdk/requirements-dev.txt
          uv run python scripts/check_secrets.py
      - name: Run CDK tests
        run: python -m pytest cdk/tests -q
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Synthesize
        working-directory: cdk
        run: cdk synth --context environment=${{ inputs.environment }} --quiet
      - name: Diff
        working-directory: cdk
        run: cdk diff --context environment=${{ inputs.environment }}
      - name: Deploy
        if: ${{ inputs.deploy == true }}
        working-directory: cdk
        run: cdk deploy --all --context environment=${{ inputs.environment }} --require-approval never
