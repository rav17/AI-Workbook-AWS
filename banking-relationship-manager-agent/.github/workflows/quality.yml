name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.10.3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Install CDK test dependencies
        run: python -m pip install -r cdk/requirements.txt -r cdk/requirements-dev.txt
      - name: Install pinned CDK CLI
        run: npm install --global aws-cdk@2.1142.0
      - name: Build deployment artifacts
        run: uv run python scripts/build_artifacts.py --target all
      - name: Check formatting
        run: uv run python -m ruff format --check .
      - name: Lint
        run: uv run python -m ruff check .
      - name: Type check
        run: uv run python -m mypy aria
      - name: Test with coverage
        run: uv run python -m pytest --cov=aria --cov-report=term-missing --cov-fail-under=70
      - name: Test CDK and synthesize
        run: |
          python -m pytest cdk/tests -q
          cd cdk
          cdk synth --context environment=dev --context account=111111111111 --context region=us-east-1 --context cognito_user_pool_arn=arn:aws:cognito-idp:us-east-1:111111111111:userpool/us-east-1_test --context cognito_app_client_id=test-client-id --context bedrock_model_id=amazon.nova-lite-v1:0 --quiet
      - name: Dependency audit
        run: uv run pip-audit -r requirements.txt -r requirements-dev.txt -r cdk/requirements.txt -r cdk/requirements-dev.txt
      - name: Secret scan
        run: uv run python scripts/check_secrets.py