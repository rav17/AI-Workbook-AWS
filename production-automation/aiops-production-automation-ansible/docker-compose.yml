version: "3.8"
services:
  self-healing:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SLACK_WEBHOOK_URL=http://localhost:9999/slack
      - ASSET_INVENTORY_PATH=/app/config/asset_inventory.yml
      - MAPPING_CONFIG_PATH=/app/config/playbook_mapping.yml
      - AUDIT_LOG_PATH=/app/logs/audit.log
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./playbooks:/app/playbooks:ro
      - ./logs:/app/logs
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--log.level=debug"

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager
