[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-infrastructure"
version = "0.1.0"
description = "Automated self-healing infrastructure pipeline with Prometheus Alertmanager and Ansible"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "boto3==1.35.36",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.112.1",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "locust==2.31.5",
]
cdk = [
    "aws-cdk-lib==2.160.0",
    "constructs==10.3.0",
]
tracing = [
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
]
redis = [
    "redis==5.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "integration: Integration tests",
    "cdk: CDK assertion tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
