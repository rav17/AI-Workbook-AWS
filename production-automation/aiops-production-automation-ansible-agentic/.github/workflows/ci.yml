name: CI

on:
  push:
    branches: [main, staging]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run lint and format check
        run: |
          ruff check .
          ruff format --check .

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: pytest -m unit --cov=src --cov-fail-under=80 --cov-report=xml --cov-report=term

  property-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run property-based tests
        run: pytest -m property --hypothesis-seed=0

  cdk-synth:
    needs: [unit-tests, property-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev,cdk]"
      - name: CDK synth all stacks
        run: npx aws-cdk@2 synth --all --context environment=dev
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out/
          retention-days: 90

  cdk-tests:
    needs: cdk-synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev,cdk]"
      - name: Run CDK assertion tests
        run: pytest -m cdk

  docker-build:
    needs: cdk-tests
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.image_tag }}
      environment: ${{ steps.tag.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine image tag
        id: tag
        run: |
          SHA7=${GITHUB_SHA::7}
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          echo "image_tag=${SHA7}-${ENV}" >> $GITHUB_OUTPUT
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHA7}-${ENV}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            aiops:${{ steps.tag.outputs.image_tag }}
            aiops:latest-${{ steps.tag.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ecr-scan-push:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/aiops:${{ needs.docker-build.outputs.image-tag }}
            ${{ steps.ecr-login.outputs.registry }}/aiops:latest-${{ needs.docker-build.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Wait for ECR scan and check results
        run: python scripts/ecr_push_and_scan.py
        env:
          IMAGE_TAG: ${{ needs.docker-build.outputs.image-tag }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: aiops
      - name: Write deployment artifact
        run: |
          cat > image-tag.json <<EOF
          {
            "image_tag": "${{ needs.docker-build.outputs.image-tag }}",
            "digest": "${{ steps.push.outputs.digest }}",
            "environment": "${{ needs.docker-build.outputs.environment }}",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.json
          retention-days: 90
