---
# Fix High Memory — finds the top memory consumers and kills the offending process.
# Used by the AIOps self-healing pipeline when the HighMemoryUsage alert fires.
# Executes via SSM (no SSH required).
#
# NOTE: src/executor.py runs only the shell/command/systemd tasks of a playbook, as one
# bash script, and does not render Jinja. Keep every task a plain shell command.
- name: Fix high memory usage
  hosts: all
  become: true
  tasks:
    - name: Show top memory consumers (before)
      ansible.builtin.shell: |
        free -m
        ps -eo pid,user,comm,%mem,rss --sort=-%mem | head -6
      changed_when: false

    - name: Kill stress-ng (parent and workers)
      ansible.builtin.shell: |
        # Without -f, pkill matches the process NAME (comm), not the full command line,
        # so this cannot match the shell running this script. The regex also covers the
        # workers, which stress-ng renames to stress-ng-vm, stress-ng-cpu, etc.
        if pgrep '^stress-ng' > /dev/null; then
          pkill -TERM '^stress-ng'
          sleep 3
          pkill -KILL '^stress-ng' || true
          echo "stress-ng terminated"
        else
          echo "stress-ng not running"
        fi
      changed_when: true

    - name: Kill other runaway memory consumers (non-root, > 50% memory, max 3)
      ansible.builtin.shell: |
        # Conservative fallback for a non-stress cause. Root-owned and critical
        # processes are never touched.
        ps -eo pid=,user=,comm=,%mem= --sort=-%mem \
          | awk 'NR <= 10 && $2 != "root" && $4 > 50 {print $1, $3, $4}' \
          | grep -Ev '^[0-9]+ (systemd|sshd|amazon-ssm-agen|ssm-agent-work|amazon-cloudwat|dbus-daemon|chronyd|containerd|dockerd) ' \
          | head -3 | while read -r pid comm mem; do
            echo "Terminating $comm (pid $pid, ${mem}% memory)"
            kill -TERM "$pid" || true
        done
      changed_when: true
      ignore_errors: true

    - name: Verify memory is back to normal
      ansible.builtin.shell: |
        sleep 5
        free -m
        ps -eo pid,user,comm,%mem,rss --sort=-%mem | head -6
        # Same signal as the alarm: available memory (includes reclaimable cache).
        AVAIL=$(awk '/MemTotal/ {t=$2} /MemAvailable/ {a=$2} END {printf "%d", a/t*100}' /proc/meminfo)
        echo "Memory available: ${AVAIL}%"
        # Fail if available memory is still below 20% (the alarm threshold)
        [ "${AVAIL:-0}" -ge 20 ]
      register: mem_check
      retries: 3
      delay: 10
      until: mem_check.rc == 0
      ignore_errors: true

    - name: Report result
      ansible.builtin.debug:
        msg: "Remediation complete. stress-ng killed and runaway memory consumers handled."
