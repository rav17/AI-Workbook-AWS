# Alertmanager configuration for AIOps local development.
# Routes all alerts to the self-healing webhook endpoint.

global:
  resolve_timeout: 5m

route:
  receiver: "aiops-webhook"
  group_by: ["alertname", "service_name"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

  routes:
    # Critical alerts — shorter wait time
    - match:
        severity: critical
      receiver: "aiops-webhook"
      group_wait: 5s
      repeat_interval: 5m

    # Warning alerts — standard grouping
    - match:
        severity: warning
      receiver: "aiops-webhook"
      group_wait: 15s

    # Info alerts — longer grouping to reduce noise
    - match:
        severity: info
      receiver: "aiops-webhook"
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: "aiops-webhook"
    webhook_configs:
      - url: "http://self-healing:8080/webhook"
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: true

# Inhibition rules — prevent lower-severity alerts when critical is firing
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
